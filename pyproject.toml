[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilelang-fa-v100"
version = "1.0.0"
description = "TileLang-optimized FlashAttention for Tesla V100 (SM70)"
requires-python = ">=3.10"
dependencies = [
    "tilelang>=0.1.9",
    "torch>=2.5.0",
]
